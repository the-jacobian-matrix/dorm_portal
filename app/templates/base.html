<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Dorm Management" }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --brand: #3b5bdb;
        --brand-soft: rgba(59, 91, 219, .12);
      }
      body {
        background: radial-gradient(circle at top right, #eef2ff, #f8fafc 45%, #f4f7fb 70%);
        color: #1e293b;
      }
      .card {
        border: 1px solid rgba(15, 23, 42, .06);
        border-radius: 16px;
      }
      .container-narrow { max-width: 1080px; }
      .muted { color: #64748b; }
      .badge-soft {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .summary-tile {
        background: var(--surface);
        border: 1px solid rgba(15, 23, 42, .06);
        border-radius: 14px;
      }
      .navbar {
        backdrop-filter: blur(8px);
        background: rgba(255, 255, 255, .85) !important;
      }
      a { text-decoration: none; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom sticky-top">
      <div class="container container-narrow py-1">
        <a class="navbar-brand fw-semibold" href="/students">Dorm Portal</a>

        <div class="ms-auto d-flex align-items-center gap-2">
          {% if current_user %}
            <span class="badge badge-soft">{{ current_user.name or current_user.email }}</span>
            <a class="btn btn-sm btn-outline-secondary" href="/logout">Sign out</a>
          {% else %}
            <a class="btn btn-sm btn-primary" href="/login">Sign in</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container container-narrow py-4">
      {% if flash_error %}
        <div class="alert alert-danger shadow-sm">{{ flash_error }}</div>
      {% endif %}
      {% if flash_success %}
        <div class="alert alert-success shadow-sm">{{ flash_success }}</div>
      {% endif %}

      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
